[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supportcover-rag"
version = "0.1.0"
description = "Lightweight post-retrieval support-coverage packing for on-device multi-hop QA"
readme = "README.md"
authors = [{ name = "OpenAI" }]
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.20.0",
  "PyYAML>=6.0.1",
  "typer>=0.12.3",
  "transformers>=4.51.0",
  "numpy>=1.26.4",
  "psutil>=5.9.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
]

[project.scripts]
supportcover-rag = "supportcover_rag.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
